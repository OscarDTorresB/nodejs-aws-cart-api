services:
  db:
    image: postgres:17
    container_name: cloudx-postgres-dev
    environment:
      POSTGRES_PASSWORD: cloudx-password
      POSTGRES_USER: cloudx-user
      POSTGRES_DB: cloudx-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: